<body data-page="photobooth">
<header class="topbar"><nav aria-label="Navigasi utama"><a href="../index.html" data-key="home">Home</a><a href="../pages/memories.html" data-key="memories">Our Memories</a><a href="../pages/letter.html" data-key="letter">A Letter</a><a href="../pages/photobooth.html" data-key="photobooth" aria-current="page">Photobooth</a><a href="../games/bunny-rescue/index.html" data-key="bunny">Bunny Rescue</a><a href="../pages/final-surprise.html" data-key="final">Surprise</a></nav></header>
<main>

<section class="wrap">
  <h1>Cute Photobooth</h1>
  <p class="lead">Tiga jepretan, masing-masing dengan hitung mundur 3 detik. Fotonya tidak diunggah ke mana pun.</p>
  <div class="booth">
    <div class="booth-stage">
      <div class="view">
        <video autoplay playsinline muted></video>
        <p class="placeholder">Menunggu kamera...</p>
        <div class="count" aria-live="assertive" hidden></div>
        <div class="flash"></div>
      </div>
      <p class="status" role="status"></p>
      <div class="row">
        <button type="button" class="btn" id="start" disabled>START PHOTOBOOTH</button>
        <button type="button" class="btn ghost" id="camera" hidden>Coba kamera lagi</button>
        <button type="button" class="btn ghost" id="sound" aria-pressed="true">Shutter: on</button>
      </div>
    </div>
    <div class="result" hidden>
      <canvas aria-label="Hasil photo strip"></canvas>
      <div class="row"><button type="button" class="btn" id="download">DOWNLOAD PNG</button><button type="button" class="btn ghost" id="retake">RETAKE</button></div>
    </div>
  </div>
</section>

</main>
<footer>A little world made just for you. With love, Raddie A.K.A Yours.</footer>
<button class="music-toggle" type="button" aria-pressed="false">Music: off</button>
<script defer src="../js/main.bundle.js"></script>
<script defer src="../js/photobooth.bundle.js"></script>
</body>
</html>
